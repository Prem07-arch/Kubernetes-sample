replicaCount: 2

image:
  repository: ""      # e.g. <account_id>.dkr.ecr.<region>.amazonaws.com/demo-app
  tag: ""              # set at deploy time via --set image.tag=<git-sha>
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
